<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Risk Concept Classifier</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }
        
        .stat { display: flex; align-items: center; gap: 5px; }
        .stat-badge {
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }
        
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .taxonomy-panel {
            width: 45%;
            border-right: 2px solid #ddd;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .concepts-panel {
            width: 55%;
            overflow-y: auto;
            padding: 20px;
        }
        
        .panel-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .tree-node {
            margin-left: 20px;
            margin-bottom: 5px;
        }
        
        .tree-node.collapsed > .drop-zone,
        .tree-node.collapsed > .tree-node {
            display: none;
        }
        
        .node-label.will-be-removed {
            opacity: 0.5;
            text-decoration: line-through;
        }
        
        .node-label.will-be-removed .equiv-target {
            text-decoration: none;
            color: #2196f3;
            font-weight: bold;
            margin-left: 5px;
        }
        
        .node-label {
            display: flex;
            align-items: center;
            padding: 5px;
            cursor: pointer;
            user-select: none;
        }
        
        .node-label:hover { background: rgba(0,0,0,0.05); }
        
        .toggle {
            width: 20px;
            display: inline-block;
            cursor: pointer;
        }
        
        .drop-zone {
            min-height: 30px;
            margin: 5px 0 5px 20px;
            padding: 10px;
            border: 2px dashed #ccc;
            border-radius: 4px;
            background: white;
            color: #999;
            font-size: 12px;
            text-align: center;
        }
        
        .drop-zone.over {
            background: #e3f2fd;
            border-color: #2196f3;
            color: #2196f3;
        }
        
        .concepts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        
        .concept-tile {
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            cursor: move;
            transition: all 0.2s;
        }
        
        .concept-tile:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .concept-tile.dragging {
            opacity: 0.5;
        }
        
        .concept-tile.equiv { border-color: #2196f3; background: #e3f2fd; }
        .concept-tile.add { border-color: #4caf50; background: #e8f5e9; }
        .concept-tile.delete { border-color: #f44336; background: #ffebee; }
        
        .concept-name {
            font-weight: bold;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        
        .concept-usage {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        
        .action-btn {
            flex: 1;
            padding: 4px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        
        .action-btn:hover { background: #f0f0f0; }
        .action-btn.active { font-weight: bold; }
        .action-btn.equiv.active { background: #2196f3; color: white; border-color: #2196f3; }
        .action-btn.add.active { background: #4caf50; color: white; border-color: #4caf50; }
        .action-btn.delete.active { background: #f44336; color: white; border-color: #f44336; }
        
        .equiv-input {
            margin-top: 8px;
            width: 100%;
            padding: 4px;
            border: 1px solid #2196f3;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .footer {
            background: #f8f9fa;
            border-top: 2px solid #ddd;
            padding: 15px 20px;
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #2196f3;
            color: white;
        }
        
        .btn-primary:hover { background: #1976d2; }
        
        .btn-success {
            background: #4caf50;
            color: white;
        }
        
        .btn-success:hover { background: #388e3c; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Risk Concept Classifier</h1>
        <div class="stats">
            <div class="stat">
                <span>EQUIV:</span>
                <span class="stat-badge" id="equiv-count">0</span>
            </div>
            <div class="stat">
                <span>ADD:</span>
                <span class="stat-badge" id="add-count">0</span>
            </div>
            <div class="stat">
                <span>DELETE:</span>
                <span class="stat-badge" id="delete-count">0</span>
            </div>
            <div class="stat">
                <span>TODO:</span>
                <span class="stat-badge" id="todo-count">0</span>
            </div>
        </div>
    </div>
    
    <div class="main">
        <div class="taxonomy-panel">
            <div class="panel-header">📊 Current Taxonomy</div>
            <div class="controls">
                <input type="text" id="taxonomy-search" placeholder="Search taxonomy..." onkeyup="renderTaxonomy()">
            </div>
            <div id="taxonomy-tree"></div>
        </div>
        
        <div class="concepts-panel">
            <div class="panel-header">🎯 Unclassified Concepts</div>
            <div class="controls">
                <input type="text" id="search" placeholder="Search concepts...">
                <select id="sort">
                    <option value="usage">Sort by Usage</option>
                    <option value="name">Sort by Name</option>
                </select>
                <button class="btn btn-primary" onclick="addNewConcept()">➕ Add New</button>
            </div>
            <div class="concepts-grid" id="concepts-grid"></div>
        </div>
    </div>
    
    <div class="footer">
        <input type="file" id="csv-file" accept=".csv" style="display:none" onchange="handleFileUpload(event)">
        <button class="btn btn-danger" onclick="clearState()">🗑️ Clear/Reset</button>
        <button class="btn btn-primary" onclick="document.getElementById('csv-file').click()">📂 Load CSV</button>
        <button class="btn btn-success" onclick="exportSPARQL()">📥 Export All (3 files)</button>
        <button class="btn btn-success" onclick="exportEquivalents()">📥 Equivalents</button>
        <button class="btn btn-success" onclick="exportAdditions()">📥 Additions</button>
        <button class="btn btn-success" onclick="exportDeletions()">📥 Deletions</button>
        <button class="btn btn-primary" onclick="saveProgress()">💾 Save Progress</button>
        <button class="btn btn-primary" onclick="loadProgress()">📁 Load Saved Progress</button>
    </div>

    <script>
        // State
        let state = {
            taxonomy: {},
            concepts: [],
            renames: [], // {oldName, newName}
            moves: [] // {concept, oldParent, newParent}
        };

        // Load CSV data
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        parseCSV(e.target.result);
                        console.log('CSV loaded successfully');
                        console.log('Taxonomy:', state.taxonomy);
                        console.log('Concepts:', state.concepts.length);
                    } catch (err) {
                        console.error('Error parsing CSV:', err);
                        alert('Error loading CSV: ' + err.message);
                    }
                };
                reader.onerror = (e) => {
                    console.error('Error reading file:', e);
                    alert('Error reading file');
                };
                reader.readAsText(file);
            }
        }

        async function loadCSV() {
            // Try to load from same directory
            try {
                const response = await fetch('risk_classification_worksheet.csv');
                if (response.ok) {
                    const text = await response.text();
                    parseCSV(text);
                } else {
                    console.log('CSV not found, use Load CSV button');
                }
            } catch (e) {
                console.log('CSV not found, use Load CSV button');
            }
        }

        function clearState() {
            if (confirm('Clear all data and reset? This will remove all taxonomy and concepts.')) {
                state.taxonomy = {};
                state.concepts = [];
                state.renames = [];
                state.moves = [];
                localStorage.removeItem('riskClassifierState');
                renderTaxonomy();
                renderConcepts();
                console.log('State cleared');
                alert('State cleared. You can now load a new CSV.');
            }
        }

        function parseCSV(text) {
            console.log('Parsing CSV, length:', text.length);
            const lines = text.split('\n');
            console.log('Total lines:', lines.length);
            
            let inTaxonomy = false;
            let inConcepts = false;
            let lastAtLevel = {};
            let taxonomyCount = 0;
            let conceptCount = 0;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                if (line.includes('CURRENT RISK TAXONOMY')) {
                    inTaxonomy = true;
                    console.log('Found taxonomy section at line', i);
                    continue;
                }
                if (line.includes('IRRELEVANT CONCEPTS')) {
                    inTaxonomy = false;
                    inConcepts = true;
                    console.log('Found concepts section at line', i);
                    continue;
                }
                
                const cols = line.split(',');
                
                if (inTaxonomy && cols.length > 8) {
                    // Check column 9 (index 8) for EXISTING
                    const actionCol = cols[8] ? cols[8].trim() : '';
                    if (i < 20) console.log('Taxonomy line', i, 'action:', actionCol, 'cols:', cols.length);
                    
                    if (actionCol === 'EXISTING') {
                        taxonomyCount++;
                        // Build hierarchy from columns 0-7 (8 levels)
                        for (let j = 0; j < 8; j++) {
                            if (cols[j] && cols[j].trim()) {
                                const name = cols[j].trim();
                                const parent = j > 0 ? lastAtLevel[j-1] : null;
                                
                                if (!state.taxonomy[name]) {
                                    state.taxonomy[name] = { 
                                        level: j, 
                                        parent: parent,
                                        children: [] 
                                    };
                                }
                                
                                if (parent && state.taxonomy[parent]) {
                                    if (!state.taxonomy[parent].children.includes(name)) {
                                        state.taxonomy[parent].children.push(name);
                                    }
                                }
                                
                                lastAtLevel[j] = name;
                                break;
                            }
                        }
                    }
                }
                
                if (inConcepts && cols[0] && cols[0].trim()) {
                    // Check column 9 (index 8) for TODO
                    const actionCol = cols.length > 8 && cols[8] ? cols[8].trim() : '';
                    if (conceptCount < 5) console.log('Concept line', i, 'action:', actionCol, 'name:', cols[0]);
                    
                    if (actionCol === 'TODO') {
                        conceptCount++;
                        state.concepts.push({
                            name: cols[0].trim(),
                            usage: parseInt(cols[9]) || 0,
                            action: null,
                            target: null,
                            parent: null
                        });
                    }
                }
            }
            
            console.log('Parsed taxonomy items:', taxonomyCount);
            console.log('Parsed concepts:', conceptCount);
            console.log('Final taxonomy:', Object.keys(state.taxonomy).length);
            console.log('Final concepts:', state.concepts.length);
            
            render();
        }

        function renderTaxonomy() {
            const tree = document.getElementById('taxonomy-tree');
            const search = document.getElementById('taxonomy-search') ? 
                          document.getElementById('taxonomy-search').value.toLowerCase() : '';
            tree.innerHTML = '';
            
            // Find root nodes (no parent)
            const roots = Object.entries(state.taxonomy)
                .filter(([name, data]) => !data.parent)
                .map(([name]) => name);
            
            for (let root of roots) {
                renderNode(tree, root, 0, search);
            }
        }

        function renderNode(container, name, depth, search = '') {
            const data = state.taxonomy[name];
            if (!data) return;
            
            // Check if this concept has an EQUIV mapping
            const concept = state.concepts.find(c => c.name === name && c.action === 'equiv');
            const hasEquiv = concept && concept.target;
            
            // Filter by search
            const matchesSearch = !search || name.toLowerCase().includes(search);
            const childrenMatch = data.children && data.children.some(child => 
                child.toLowerCase().includes(search) || hasMatchingDescendant(child, search)
            );
            
            if (!matchesSearch && !childrenMatch) return;
            
            const node = document.createElement('div');
            node.className = 'tree-node';
            node.style.marginLeft = `${depth * 20}px`;
            node.dataset.name = name;
            node.draggable = true;
            
            const hasChildren = data.children && data.children.length > 0;
            const isCollapsed = data.collapsed || false;
            
            if (isCollapsed) {
                node.classList.add('collapsed');
            }
            
            // Highlight if matches search
            const nameDisplay = matchesSearch && search ? 
                name.replace(new RegExp(search, 'gi'), match => `<mark>${match}</mark>`) : name;
            
            const equivIndicator = hasEquiv ? `<span class="equiv-target">→ ${concept.target}</span>` : '';
            
            node.innerHTML = `
                <div class="node-label ${hasEquiv ? 'will-be-removed' : ''}">
                    <span class="toggle" onclick="toggleNode('${name}')">${hasChildren ? (isCollapsed ? '▸' : '▼') : '▸'}</span>
                    <span>${nameDisplay}${equivIndicator}</span>
                    <button class="action-btn" style="margin-left: 10px; font-size: 10px;" 
                            onclick="renameTaxonomy('${name}')">✏️</button>
                    <button class="action-btn" style="margin-left: 5px; font-size: 10px;" 
                            onclick="deleteTaxonomy('${name}')">🗑️</button>
                </div>
                <div class="drop-zone" data-parent="${name}">
                    Drop here to add as subclass of ${name}
                </div>
            `;
            
            container.appendChild(node);
            
            // Add drag listeners for taxonomy nodes
            node.addEventListener('dragstart', handleTaxonomyDragStart);
            node.addEventListener('dragend', handleDragEnd);
            
            // Add drop zone listeners
            const dropZone = node.querySelector('.drop-zone');
            dropZone.addEventListener('dragover', handleDragOver);
            dropZone.addEventListener('dragleave', handleDragLeave);
            dropZone.addEventListener('drop', handleDrop);
            
            // Render children (if not collapsed or if searching)
            if (hasChildren && (!isCollapsed || search)) {
                for (let child of data.children) {
                    renderNode(container, child, depth + 1, search);
                }
            }
        }

        function hasMatchingDescendant(name, search) {
            const data = state.taxonomy[name];
            if (!data) return false;
            if (name.toLowerCase().includes(search)) return true;
            if (data.children) {
                return data.children.some(child => hasMatchingDescendant(child, search));
            }
            return false;
        }

        function toggleNode(name) {
            const data = state.taxonomy[name];
            if (data) {
                data.collapsed = !data.collapsed;
                render();
            }
        }

        function renderConcepts() {
            const grid = document.getElementById('concepts-grid');
            const search = document.getElementById('search').value.toLowerCase();
            const sort = document.getElementById('sort').value;
            
            // Show all concepts - don't hide based on taxonomy presence
            // User needs to see them to set actions
            let filtered = state.concepts.filter(c => 
                c.name.toLowerCase().includes(search)
            );
            
            if (sort === 'usage') {
                filtered.sort((a, b) => b.usage - a.usage);
            } else {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }
            
            grid.innerHTML = '';
            
            for (let concept of filtered) {
                const tile = document.createElement('div');
                tile.className = `concept-tile ${concept.action || ''}`;
                tile.draggable = true;
                tile.dataset.concept = concept.name;
                
                tile.innerHTML = `
                    <div class="concept-name">${concept.name}</div>
                    <div class="concept-usage">${concept.usage} uses</div>
                    <div class="action-buttons">
                        <button class="action-btn equiv ${concept.action === 'equiv' ? 'active' : ''}" 
                                onclick="setAction('${concept.name}', 'equiv')">EQUIV</button>
                        <button class="action-btn add ${concept.action === 'add' ? 'active' : ''}"
                                onclick="setAction('${concept.name}', 'add')">ADD</button>
                        <button class="action-btn delete ${concept.action === 'delete' ? 'active' : ''}"
                                onclick="setAction('${concept.name}', 'delete')">DELETE</button>
                    </div>
                    <div class="action-buttons" style="margin-top: 5px;">
                        <button class="action-btn" onclick="renameConcept('${concept.name}')">✏️ Rename</button>
                        <button class="action-btn" onclick="makeParent('${concept.name}')">📁 Make Parent</button>
                    </div>
                    ${concept.action === 'equiv' ? `
                        <input type="text" class="equiv-input" 
                               placeholder="→ Target concept"
                               value="${concept.target || ''}"
                               onchange="setTarget('${concept.name}', this.value)">
                    ` : ''}
                `;
                
                tile.addEventListener('dragstart', handleDragStart);
                tile.addEventListener('dragend', handleDragEnd);
                
                grid.appendChild(tile);
            }
            
            updateStats();
        }

        function setAction(name, action) {
            const concept = state.concepts.find(c => c.name === name);
            if (concept.action === action) {
                concept.action = null;
                concept.target = null;
            } else {
                concept.action = action;
            }
            render();
        }

        function setTarget(name, target) {
            const concept = state.concepts.find(c => c.name === name);
            concept.target = target;
        }

        function renameConcept(oldName) {
            const newName = prompt(`Rename "${oldName}" to:`, oldName);
            if (newName && newName !== oldName) {
                const concept = state.concepts.find(c => c.name === oldName);
                if (concept) {
                    concept.name = newName;
                }
                
                // If this concept is also in taxonomy, update it there too
                if (state.taxonomy[oldName]) {
                    state.taxonomy[newName] = state.taxonomy[oldName];
                    delete state.taxonomy[oldName];
                    
                    // Update parent's children array
                    const parent = state.taxonomy[newName].parent;
                    if (parent && state.taxonomy[parent]) {
                        const idx = state.taxonomy[parent].children.indexOf(oldName);
                        if (idx !== -1) {
                            state.taxonomy[parent].children[idx] = newName;
                        }
                    }
                    
                    // Update all children's parent reference
                    if (state.taxonomy[newName].children) {
                        for (let child of state.taxonomy[newName].children) {
                            if (state.taxonomy[child]) {
                                state.taxonomy[child].parent = newName;
                            }
                        }
                    }
                }
                
                state.renames.push({oldName, newName});
                render();
            }
        }

        function makeParent(name) {
            const concept = state.concepts.find(c => c.name === name);
            if (concept) {
                // Remove from concepts, add to taxonomy
                state.concepts = state.concepts.filter(c => c.name !== name);
                state.taxonomy[name] = {
                    level: 1, 
                    parent: 'Risk',
                    children: []
                };
                // Add to Risk's children
                if (state.taxonomy['Risk']) {
                    if (!state.taxonomy['Risk'].children.includes(name)) {
                        state.taxonomy['Risk'].children.push(name);
                    }
                }
                render();
            }
        }

        function renameTaxonomy(oldName) {
            const newName = prompt(`Rename "${oldName}" to:`, oldName);
            if (newName && newName !== oldName) {
                // Copy the node data
                state.taxonomy[newName] = state.taxonomy[oldName];
                delete state.taxonomy[oldName];
                
                // Update parent's children array
                const parent = state.taxonomy[newName].parent;
                if (parent && state.taxonomy[parent]) {
                    const idx = state.taxonomy[parent].children.indexOf(oldName);
                    if (idx !== -1) {
                        state.taxonomy[parent].children[idx] = newName;
                    }
                }
                
                // Update all children's parent reference
                if (state.taxonomy[newName].children) {
                    for (let child of state.taxonomy[newName].children) {
                        if (state.taxonomy[child]) {
                            state.taxonomy[child].parent = newName;
                        }
                    }
                }
                
                // Track the rename
                state.renames.push({oldName, newName});
                
                render();
            }
        }

        function deleteTaxonomy(name) {
            if (confirm(`Delete "${name}" from taxonomy?`)) {
                delete state.taxonomy[name];
                render();
            }
        }

        function addNewConcept() {
            const name = prompt('Enter new concept name (e.g., "TornadoRisk"):');
            if (name && name.trim()) {
                state.concepts.push({
                    name: name.trim(),
                    usage: 0,
                    action: null,
                    target: null,
                    parent: null
                });
                render();
            }
        }

        function updateStats() {
            document.getElementById('equiv-count').textContent = 
                state.concepts.filter(c => c.action === 'equiv').length;
            document.getElementById('add-count').textContent = 
                state.concepts.filter(c => c.action === 'add').length;
            document.getElementById('delete-count').textContent = 
                state.concepts.filter(c => c.action === 'delete').length;
            document.getElementById('todo-count').textContent = 
                state.concepts.filter(c => !c.action).length;
        }

        // Drag and drop
        let draggedConcept = null;
        let draggedTaxonomy = null;

        function handleDragStart(e) {
            draggedConcept = e.target.dataset.concept;
            e.target.classList.add('dragging');
        }

        function handleTaxonomyDragStart(e) {
            draggedTaxonomy = e.target.dataset.name;
            e.dataTransfer.effectAllowed = 'move';
            e.target.classList.add('dragging');
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            draggedConcept = null;
            draggedTaxonomy = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('over');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('over');
            
            const parent = e.currentTarget.dataset.parent;
            
            // Handle concept drop
            if (draggedConcept) {
                const concept = state.concepts.find(c => c.name === draggedConcept);
                
                if (concept) {
                    concept.parent = parent;
                    concept.action = 'add';
                    
                    // Add to taxonomy structure
                    if (!state.taxonomy[concept.name]) {
                        state.taxonomy[concept.name] = {
                            level: state.taxonomy[parent].level + 1,
                            parent: parent,
                            children: []
                        };
                    }
                    
                    // Add to parent's children (allow multiple parents)
                    if (!state.taxonomy[parent].children.includes(concept.name)) {
                        state.taxonomy[parent].children.push(concept.name);
                    }
                    
                    render();
                }
            }
            
            // Handle taxonomy node drop (rearrange)
            if (draggedTaxonomy && draggedTaxonomy !== parent) {
                const node = state.taxonomy[draggedTaxonomy];
                
                if (node) {
                    const oldParent = node.parent;
                    
                    // Remove from old parent
                    if (oldParent && state.taxonomy[oldParent]) {
                        state.taxonomy[oldParent].children = 
                            state.taxonomy[oldParent].children.filter(c => c !== draggedTaxonomy);
                    }
                    
                    // Add to new parent
                    node.parent = parent;
                    node.level = state.taxonomy[parent].level + 1;
                    
                    if (!state.taxonomy[parent].children.includes(draggedTaxonomy)) {
                        state.taxonomy[parent].children.push(draggedTaxonomy);
                    }
                    
                    // Track the move for SPARQL generation
                    if (oldParent) {
                        state.moves.push({
                            concept: draggedTaxonomy,
                            oldParent: oldParent,
                            newParent: parent
                        });
                    }
                    
                    render();
                }
            }
        }

        async function exportSPARQL() {
            // Try to download all 3 files
            await exportEquivalents();
            await new Promise(resolve => setTimeout(resolve, 200));
            await exportAdditions();
            await new Promise(resolve => setTimeout(resolve, 200));
            await exportDeletions();
        }

        async function exportEquivalents() {
            const equivalents = state.concepts.filter(c => c.action === 'equiv');
            
            let equivSPARQL = 'PREFIX sg: <http://solve.global/knowledge-commons/>\n\n';
            
            // Add renames first
            for (let r of state.renames) {
                equivSPARQL += `# Rename ${r.oldName} → ${r.newName}\n`;
                equivSPARQL += `DELETE { ?solution sg:addressesRisk sg:${r.oldName} }\n`;
                equivSPARQL += `INSERT { ?solution sg:addressesRisk sg:${r.newName} }\n`;
                equivSPARQL += `WHERE { ?solution sg:addressesRisk sg:${r.oldName} } ;\n\n`;
            }
            
            for (let c of equivalents) {
                equivSPARQL += `# ${c.name} → ${c.target}\n`;
                equivSPARQL += `DELETE { ?solution sg:addressesRisk sg:${c.name} }\n`;
                equivSPARQL += `INSERT { ?solution sg:addressesRisk sg:${c.target} }\n`;
                equivSPARQL += `WHERE { ?solution sg:addressesRisk sg:${c.name} } ;\n\n`;
            }
            
            await download('risk_equivalents_remap_FINAL.sparql', equivSPARQL);
            console.log('Exported equivalents:', state.renames.length + equivalents.length);
        }

        async function exportAdditions() {
            const additions = state.concepts.filter(c => c.action === 'add');
            
            // Initialize moves array if it doesn't exist (for old saved states)
            if (!state.moves) {
                state.moves = [];
            }
            
            let addTTL = '@prefix sg: <http://solve.global/knowledge-commons/> .\n';
            addTTL += '@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .\n';
            addTTL += '@prefix owl: <http://www.w3.org/2001/02/22-rdf-syntax-ns#> .\n\n';
            
            // Add taxonomy moves (reparenting existing concepts)
            if (state.moves.length > 0) {
                addTTL += '# Taxonomy rearrangements (update subClassOf)\n\n';
                for (let m of state.moves) {
                    addTTL += `# Move ${m.concept}: ${m.oldParent} → ${m.newParent}\n`;
                    addTTL += `# DELETE { sg:${m.concept} rdfs:subClassOf sg:${m.oldParent} }\n`;
                    addTTL += `# INSERT { sg:${m.concept} rdfs:subClassOf sg:${m.newParent} }\n\n`;
                }
                addTTL += '# Note: Execute these as SPARQL UPDATE queries in Neptune\n\n';
            }
            
            // Add new concepts
            for (let c of additions) {
                // Get all parents for this concept
                const parents = [];
                for (let [name, data] of Object.entries(state.taxonomy)) {
                    if (data.children && data.children.includes(c.name)) {
                        parents.push(name);
                    }
                }
                
                addTTL += `sg:${c.name} a owl:Class ;\n`;
                if (parents.length > 0) {
                    addTTL += `    rdfs:subClassOf `;
                    for (let i = 0; i < parents.length; i++) {
                        addTTL += `sg:${parents[i]}`;
                        addTTL += i < parents.length - 1 ? ' , ' : ' ;\n';
                    }
                } else {
                    addTTL += `    rdfs:subClassOf sg:${c.parent || 'Risk'} ;\n`;
                }
                addTTL += `    rdfs:label "${c.name.replace('Risk', ' Risk')}"@en .\n\n`;
            }
            
            await download('risk_additions_FINAL.ttl', addTTL);
            console.log('Exported additions:', additions.length, 'moves:', state.moves.length);
        }

        async function exportDeletions() {
            const deletions = state.concepts.filter(c => c.action === 'delete');
            
            let delSPARQL = 'PREFIX sg: <http://solve.global/knowledge-commons/>\n\n';
            for (let c of deletions) {
                delSPARQL += `DELETE { ?solution sg:addressesRisk sg:${c.name} }\n`;
                delSPARQL += `WHERE { ?solution sg:addressesRisk sg:${c.name} } ;\n\n`;
            }
            
            await download('risk_irrelevant_remove_FINAL.sparql', delSPARQL);
            console.log('Exported deletions:', deletions.length);
        }

        function download(filename, text) {
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            // Add delay between downloads
            return new Promise(resolve => setTimeout(resolve, 100));
        }

        function saveProgress() {
            localStorage.setItem('risk-classifier-state', JSON.stringify(state));
            alert('Progress saved!');
        }

        function loadProgress() {
            const saved = localStorage.getItem('risk-classifier-state');
            if (saved) {
                state = JSON.parse(saved);
                // Initialize moves array if it doesn't exist (backward compatibility)
                if (!state.moves) {
                    state.moves = [];
                }
                render();
                alert('Progress loaded!');
            }
        }

        function render() {
            renderTaxonomy();
            renderConcepts();
        }

        // Event listeners
        document.getElementById('search').addEventListener('input', renderConcepts);
        document.getElementById('sort').addEventListener('change', renderConcepts);

        // Initialize
        loadCSV();
    </script>
</body>
</html>
