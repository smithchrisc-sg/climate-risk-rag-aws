<!DOCTYPE html>
<html>
<head>
    <title>GAIP API Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { background: #007cba; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        button:hover { background: #005a87; }
        .results { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px; }
        .result-item { margin: 15px 0; padding: 10px; background: white; border-radius: 3px; }
        .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 3px; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <h1>GAIP Knowledge Repository API Test</h1>
    
    <div class="form-group">
        <label>API Endpoint:</label>
        <input type="text" id="apiEndpoint" placeholder="https://abc123.execute-api.us-east-1.amazonaws.com/v1">
    </div>
    
    <div class="form-group">
        <label>API Key (Bearer Token):</label>
        <textarea id="apiKey" rows="3" placeholder="Paste your JWT token here">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJyZXNlYXJjaGVyQHNvbHZlLmdsb2JhbCIsIm9yZyI6InNvbHZlLWdsb2JhbCIsInJvbGVzIjpbInNlYXJjaCJdLCJpYXQiOjE3NTgwNjQ1MzAsImV4cCI6MTc2MDY1NjUzMCwidHlwZSI6ImFwaV9rZXkifQ.BVtSC3sr4hOUOHj7Cj3olGEh784s9TDo9HoIiWVhf04</textarea>
    </div>
    
    <div class="form-group">
        <label>Search Query:</label>
        <input type="text" id="searchQuery" placeholder="climate risk North Macedonia" value="climate risk North Macedonia">
    </div>
    
    <div class="form-group">
        <label>Categories (comma-separated):</label>
        <input type="text" id="categories" placeholder="climate, risk-assessment">
    </div>
    
    <div class="form-group">
        <label>Regions (comma-separated):</label>
        <input type="text" id="regions" placeholder="North Macedonia, Europe">
    </div>
    
    <div class="form-group">
        <label>Result Limit:</label>
        <select id="limit">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
        </select>
    </div>
    
    <button onclick="executeSearch()">Search</button>
    
    <div id="results"></div>

    <script>
        async function executeSearch() {
            const resultsDiv = document.getElementById('results');
            const apiEndpoint = document.getElementById('apiEndpoint').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const query = document.getElementById('searchQuery').value.trim();
            
            if (!apiEndpoint || !apiKey || !query) {
                resultsDiv.innerHTML = '<div class="error">Please fill in API endpoint, API key, and search query</div>';
                return;
            }
            
            resultsDiv.innerHTML = '<div class="loading">Searching...</div>';
            
            // Build request
            const requestBody = {
                query: query,
                filters: {},
                parameters: {
                    limit: parseInt(document.getElementById('limit').value)
                }
            };
            
            // Add filters if provided
            const categories = document.getElementById('categories').value.trim();
            if (categories) {
                requestBody.filters.categories = categories.split(',').map(c => c.trim());
            }
            
            const regions = document.getElementById('regions').value.trim();
            if (regions) {
                requestBody.filters.regions = regions.split(',').map(r => r.trim());
            }
            
            try {
                const response = await fetch(`${apiEndpoint}/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || `HTTP ${response.status}`);
                }
                
                displayResults(data);
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            let html = `
                <div class="results">
                    <h3>Search Results</h3>
                    <p><strong>Query:</strong> ${data.query}</p>
                    <p><strong>Results:</strong> ${data.pagination.returned_results} of ${data.pagination.total_results}</p>
                    <p><strong>Execution Time:</strong> ${data.execution_time.toFixed(3)}s</p>
            `;
            
            if (data.results && data.results.length > 0) {
                data.results.forEach((result, index) => {
                    html += `
                        <div class="result-item">
                            <h4>${result.title || 'Untitled'}</h4>
                            <p><strong>Score:</strong> ${result.score.toFixed(3)}</p>
                            <p><strong>Type:</strong> ${result.document_type}</p>
                            <p><strong>Categories:</strong> ${result.categories.join(', ')}</p>
                            <p><strong>Regions:</strong> ${result.regions.join(', ')}</p>
                            <p><strong>Summary:</strong> ${result.summary}</p>
                            ${result.highlights.content ? `<p><strong>Highlights:</strong> ${result.highlights.content.join(' ... ')}</p>` : ''}
                            <p><strong>Search Types:</strong> ${result.metadata.search_types?.join(', ') || 'N/A'}</p>
                            <p><strong>Document ID:</strong> ${result.document_id}</p>
                        </div>
                    `;
                });
            } else {
                html += '<p>No results found.</p>';
            }
            
            html += '</div>';
            resultsDiv.innerHTML = html;
        }
        
        // Load saved values on page load
        window.onload = function() {
            const saved = localStorage.getItem('gaipTestConfig');
            if (saved) {
                const config = JSON.parse(saved);
                document.getElementById('apiEndpoint').value = config.apiEndpoint || '';
                document.getElementById('apiKey').value = config.apiKey || '';
            }
        };
        
        // Save values when they change
        document.getElementById('apiEndpoint').onchange = saveConfig;
        document.getElementById('apiKey').onchange = saveConfig;
        
        function saveConfig() {
            const config = {
                apiEndpoint: document.getElementById('apiEndpoint').value,
                apiKey: document.getElementById('apiKey').value
            };
            localStorage.setItem('gaipTestConfig', JSON.stringify(config));
        }
    </script>
</body>
</html>
