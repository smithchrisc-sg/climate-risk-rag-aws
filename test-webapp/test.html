<!DOCTYPE html>
<html>
<head>
    <title>GAIP API Test - Working</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { background: #007cba; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        button:hover { background: #005a87; }
        .results { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px; }
        .result-item { margin: 15px 0; padding: 10px; background: white; border-radius: 3px; }
        .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 3px; }
        .loading { color: #666; font-style: italic; }
        .success { color: green; background: #e6ffe6; padding: 10px; border-radius: 3px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>GAIP Knowledge Repository API Test</h1>
    
    <div class="success">
        <strong>&#x2705; API is deployed and working!</strong><br>
        Endpoint: https://43l6kohmrf.execute-api.us-east-1.amazonaws.com/v1<br>
        Successfully processing "North Macedonia" multi-word entities from your Phase 1 implementation.
    </div>
    
    <div class="form-group">
        <label>Search Query:</label>
        <input type="text" id="searchQuery" value="climate risk North Macedonia">
    </div>
    
    <div class="form-group">
        <label>Categories (comma-separated):</label>
        <input type="text" id="categories" value="climate, risk-assessment">
    </div>
    
    <div class="form-group">
        <label>Regions (comma-separated):</label>
        <input type="text" id="regions" value="North Macedonia">
    </div>
    
    <button onclick="executeSearch()">Search</button>
    
    <div id="results"></div>

    <script>
        async function executeSearch() {
            const resultsDiv = document.getElementById('results');
            const query = document.getElementById('searchQuery').value.trim();
            
            if (!query) {
                resultsDiv.innerHTML = '<div class="error">Please enter a search query</div>';
                return;
            }
            
            resultsDiv.innerHTML = '<div class="loading">Searching...</div>';
            
            const requestBody = {
                query: query,
                filters: {},
                parameters: { limit: 10 }
            };
            
            const categories = document.getElementById('categories').value.trim();
            if (categories) {
                requestBody.filters.categories = categories.split(',').map(c => c.trim());
            }
            
            const regions = document.getElementById('regions').value.trim();
            if (regions) {
                requestBody.filters.regions = regions.split(',').map(r => r.trim());
            }
            
            try {
                const response = await fetch('https://43l6kohmrf.execute-api.us-east-1.amazonaws.com/v1/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || `HTTP ${response.status}`);
                }
                
                displayResults(data);
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            let html = `
                <div class="results">
                    <h3>&#x2705; Search Results</h3>
                    <p><strong>Query:</strong> ${data.query}</p>
                    <p><strong>Results:</strong> ${data.pagination.returned_results} of ${data.pagination.total_results}</p>
                    <p><strong>Execution Time:</strong> ${data.execution_time.toFixed(3)}s</p>
            `;
            
            if (data.results && data.results.length > 0) {
                data.results.forEach((result, index) => {
                    html += `
                        <div class="result-item">
                            <h4>&#x1F4C4; ${result.title}</h4>
                            <p><strong>Score:</strong> ${result.score.toFixed(3)}</p>
                            <p><strong>Type:</strong> ${result.document_type}</p>
                            <p><strong>Categories:</strong> ${result.categories.join(', ')}</p>
                            <p><strong>Regions:</strong> ${result.regions.join(', ')}</p>
                            <p><strong>Summary:</strong> ${result.summary}</p>
                            <p><strong>Highlights:</strong> ${result.highlights.content.join(' ... ')}</p>
                            <p><strong>Search Types:</strong> ${result.metadata.search_types.join(', ')}</p>
                            <p><strong>Matched Concepts:</strong> ${result.metadata.matched_concepts.join(', ')}</p>
                            <p><strong>Document ID:</strong> ${result.document_id}</p>
                        </div>
                    `;
                });
            } else {
                html += '<p>No results found.</p>';
            }
            
            html += '</div>';
            resultsDiv.innerHTML = html;
        }
        
        // Auto-run test on page load
        window.onload = function() {
            setTimeout(executeSearch, 1000);
        };
    </script>
</body>
</html>
